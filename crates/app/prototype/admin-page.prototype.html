<!doctype html>
<!--
  ПРОТОТИП, выбросить. Issue #6: как выглядит страница веб-админки.
  План: пять структурно разных вариантов страницы `GET /`, переключаются `?variant=A…E` и плашкой внизу;
  состояние загрузчика (фейковые данные) переключается `?state=…` там же.
  Веб-сервера в проекте ещё нет, поэтому это статический файл, а не маршрут axum: разметка каждого варианта —
  то, что отдал бы шаблон askama. Раз в 5 с блок сводки перерисовывается, как при опросе `/status` через HTMX.
  Времена рендерятся как <time datetime="…Z">…UTC</time> и переводятся в пояс браузера, как решено в исследовании.
  Живёт только в ветке-прототипе; победивший вариант переписывается в crates/app/templates/admin.html.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка: варианты</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1c1c1a; --muted: #6c6c66; --line: #e2e2dc;
    --ok: #1e7a3c; --ok-soft: #e6f4ea; --warn: #9a5800; --warn-soft: #fff3de;
    --bad: #b3261e; --bad-soft: #fdecea; --idle: #8a8a84; --idle-soft: #efefeb; --accent: #2f5bd3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1f1f1d; --ink: #ececea; --muted: #a2a29c; --line: #33332f;
      --ok: #6fd08f; --ok-soft: #1c3324; --warn: #f0b060; --warn-soft: #3a2e1a;
      --bad: #ff8a80; --bad-soft: #3d2220; --idle: #9a9a94; --idle-soft: #2a2a27; --accent: #8aa8ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 110px; }
  code, pre { font-family: var(--mono); font-size: 13px; }
  .muted { color: var(--muted); }
  .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-idle { color: var(--idle); }

  /* ---------- A: карточка состояния и список ---------- */
  .a-wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px; }
  .a-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .a-top h1 { font-size: 17px; margin: 0; }
  .a-stack { display: grid; gap: 12px; }
  .a-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .a-state { display: flex; gap: 14px; }
  .a-dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 9px; flex: none; }
  .a-state-title { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .a-banner { border-radius: 10px; padding: 12px 14px; background: var(--warn-soft); border-left: 4px solid var(--warn); }
  .a-err { border-radius: 10px; padding: 12px 14px; background: var(--bad-soft); border-left: 4px solid var(--bad); }
  .a-err pre { margin: 6px 0; white-space: pre-wrap; }
  .a-err.past { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .a-h-main { font-size: 20px; font-weight: 650; }
  .a-dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 0; }
  .a-dl dt { color: var(--muted); } .a-dl dd { margin: 0; }

  /* ---------- B: плитки ---------- */
  .b-strip { padding: 10px 24px; color: #fff; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .b-strip.ok { background: #1e7a3c; } .b-strip.warn { background: #9a5800; } .b-strip.bad { background: #b3261e; } .b-strip.idle { background: #6c6c66; }
  .b-strip span:last-child { font-weight: 400; opacity: .9; }
  .b-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  .b-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 820px) { .b-grid { grid-template-columns: minmax(0, 1fr); } }
  .b-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-height: 140px; display: flex; flex-direction: column; gap: 6px; }
  .b-tile.wide { grid-column: span 2; } @media (max-width: 820px) { .b-tile.wide { grid-column: auto; } }
  .b-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .b-big { font-size: 30px; font-weight: 700; line-height: 1.15; }
  .b-tile.tone-warn { border-color: var(--warn); background: var(--warn-soft); }
  .b-tile.tone-bad { border-color: var(--bad); background: var(--bad-soft); }
  .b-tile pre { margin: 0; white-space: pre-wrap; }

  /* ---------- C: хронология ---------- */
  .c-wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; }
  @media (max-width: 760px) { .c-wrap { grid-template-columns: minmax(0, 1fr); } }
  .c-side h1 { font-size: 15px; margin: 0 0 16px; color: var(--muted); font-weight: 600; }
  .c-status { font-size: 24px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
  .c-facts { margin-top: 22px; display: grid; gap: 14px; }
  .c-fact .n { font-size: 22px; font-weight: 650; }
  .c-line { position: relative; padding-left: 26px; }
  .c-line::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .c-item { position: relative; padding: 8px 0 14px; }
  .c-item::before { content: ""; position: absolute; left: -24px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--idle); }
  .c-item.future::before { border-style: dashed; }
  .c-item.tone-ok::before { border-color: var(--ok); } .c-item.tone-warn::before { border-color: var(--warn); } .c-item.tone-bad::before { border-color: var(--bad); }
  .c-when { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .c-what { font-weight: 600; }
  .c-item pre { margin: 4px 0 0; white-space: pre-wrap; color: var(--bad); }
  .c-now { position: relative; margin: 4px 0 12px -26px; padding-left: 26px; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .c-now::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--accent); z-index: 0; }
  .c-now span { position: relative; background: var(--bg); padding-right: 8px; margin-left: 4px; }

  /* ---------- D: терминал ---------- */
  .d-page { min-height: 100vh; background: #0f1110; color: #d6dcd6; font-family: var(--mono); font-size: 14px; padding: 28px 16px; }
  .d-box { max-width: 860px; margin: 0 auto; }
  .d-prompt { color: #7c877c; margin-bottom: 10px; }
  .d-box pre { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .d-ok { color: #6fd08f; } .d-warn { color: #f0b060; } .d-bad { color: #ff8a80; } .d-dim { color: #7c877c; } .d-key { color: #9fb6ff; }

  /* ---------- E: шкала ID ---------- */
  .e-wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px; }
  .e-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .e-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 600; }
  .e-pill.ok { background: var(--ok-soft); color: var(--ok); } .e-pill.warn { background: var(--warn-soft); color: var(--warn); }
  .e-pill.bad { background: var(--bad-soft); color: var(--bad); } .e-pill.idle { background: var(--idle-soft); color: var(--idle); }
  .e-hero { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; }
  .e-hero-title { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .e-bar { position: relative; height: 34px; border-radius: 8px; margin: 34px 0 30px; background: var(--idle-soft); overflow: visible; }
  .e-seg { position: absolute; top: 0; bottom: 0; }
  .e-seg.saved { background: var(--ok); opacity: .85; }
  .e-seg.pass { background: var(--accent); opacity: .85; }
  .e-seg.unknown { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--line) 6px 12px); border-radius: 8px 0 0 8px; }
  .e-seg.gap { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--line) 6px 12px); }
  .e-mark { position: absolute; top: -26px; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: var(--muted); }
  .e-mark.below { top: 38px; }
  .e-mark::after { content: ""; position: absolute; left: 50%; top: 18px; height: 12px; border-left: 1px solid var(--muted); }
  .e-mark.below::after { top: -10px; }
  .e-mark.start { transform: none; } .e-mark.start::after { left: 0; }
  .e-mark.end { transform: translateX(-100%); } .e-mark.end::after { left: 100%; }
  .e-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .e-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .e-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  @media (max-width: 760px) { .e-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .e-kv { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .e-kv .k { font-size: 12px; color: var(--muted); } .e-kv .v { font-weight: 600; }
  .e-alert { margin-top: 14px; padding: 12px 14px; border-radius: 10px; }
  .e-alert.warn { background: var(--warn-soft); } .e-alert.bad { background: var(--bad-soft); }
  .e-alert.past { border: 1px dashed var(--line); color: var(--muted); }
  .e-alert pre { margin: 4px 0 0; white-space: pre-wrap; }

  /* ---------- плашка-переключатель (не часть дизайна) ---------- */
  .proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 6px;
    background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    font: 13px/1.2 system-ui, sans-serif; width: max-content; max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; }
  .proto-bar button { background: #2a2a2a; color: #fff; border: 0; border-radius: 999px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; }
  .proto-bar button:hover { background: #444; }
  .proto-bar .lbl { min-width: 190px; text-align: center; font-weight: 600; }
  .proto-bar select { background: #2a2a2a; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; font: inherit; }
  .proto-bar .sep { width: 1px; height: 20px; background: #444; margin: 0 4px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="proto-bar" role="toolbar" aria-label="Переключатель прототипа">
  <button id="prev" title="Предыдущий вариант (←)">←</button>
  <span class="lbl" id="vlabel"></span>
  <button id="next" title="Следующий вариант (→)">→</button>
  <span class="sep"></span>
  <select id="state" title="Состояние загрузчика (фейковые данные)"></select>
</div>

<script>
// ---------------------------------------------------------------- фейковые данные
// Поля — ровно то, что вернёт функция хранилища «сводка для админки».
const S = 1000, M = 60 * S, H = 60 * M;
const STATES = {
  fresh:       { label: 'Свежая БД, загрузчик не запускался' },
  first_pass:  { label: 'Идёт первый проход', running: true, progressing: true },
  paused:      { label: 'Пауза Telegram (FLOOD_WAIT)', running: true },
  error:       { label: 'Ошибка, ждёт повтора', running: true },
  silent:      { label: 'Загрузчик не отвечает', running: false },
  loaded:      { label: 'История загружена, была ошибка ночью', running: true },
  loaded_pass: { label: 'Очередной проход за новыми', running: true, progressing: true },
};
function makeSummary(key, now) {
  const base = { now, newest_fetched_id: null, flood_wait_until: null, last_successful_request_at: null,
    last_heartbeat_at: null, last_error: null, last_error_at: null, next_attempt_at: null,
    raw_posts_count: 0, pass_reached_id: null, max_id: null };
  const firstPass = { raw_posts_count: 21902, pass_reached_id: 21384, max_id: 43870 };
  switch (key) {
    case 'fresh': return base;
    case 'first_pass': return { ...base, ...firstPass, last_heartbeat_at: now - 4 * S, last_successful_request_at: now - 2 * S };
    case 'paused': return { ...base, ...firstPass, flood_wait_until: now + 47 * M, last_heartbeat_at: now - 6 * S, last_successful_request_at: now - 3 * M };
    case 'error': return { ...base, ...firstPass, last_heartbeat_at: now - 5 * S, last_successful_request_at: now - 2 * M,
      last_error: 'Telegram: запрос не завершился за 30 с (timeout)', last_error_at: now - 20 * S, next_attempt_at: now + 40 * S };
    case 'silent': return { ...base, ...firstPass, flood_wait_until: now + 38 * M, last_heartbeat_at: now - 6 * M - 12 * S, last_successful_request_at: now - 9 * M };
    case 'loaded': return { ...base, newest_fetched_id: 43870, raw_posts_count: 43212, max_id: 43870,
      last_heartbeat_at: now - 8 * S, last_successful_request_at: now - 41 * S,
      last_error: 'Telegram: connection reset by peer', last_error_at: now - 7 * H - 12 * M, next_attempt_at: now - 7 * H - 11 * M };
    case 'loaded_pass': return { ...base, newest_fetched_id: 43870, raw_posts_count: 43298, pass_reached_id: 43905, max_id: 43990,
      last_heartbeat_at: now - 3 * S, last_successful_request_at: now - 1 * S };
  }
}
// «Опрос /status»: раз в 5 с данные чуть сдвигаются, как у живого загрузчика.
function tick(s, key) {
  const st = STATES[key], now = Date.now();
  const n = { ...s, now };
  if (st.running) n.last_heartbeat_at = now - 2 * S;
  if (st.progressing) {
    const floor = key === 'loaded_pass' ? s.newest_fetched_id + 1 : 1;
    n.pass_reached_id = Math.max(floor, s.pass_reached_id - 100);
    n.raw_posts_count = s.raw_posts_count + (s.pass_reached_id - n.pass_reached_id) - 3;
    n.last_successful_request_at = now - 1 * S;
  }
  return n;
}

// ---------------------------------------------------------------- производные поля (общие для всех вариантов)
const HEARTBEAT_SILENT_AFTER = 90 * S;
function derive(r) {
  const pauseActive = r.flood_wait_until !== null && r.flood_wait_until > r.now;
  const errorPast = r.last_error !== null && r.last_successful_request_at !== null && r.last_successful_request_at > r.last_error_at;
  let loader;
  if (r.last_heartbeat_at === null) loader = { kind: 'never', tone: 'idle', word: 'Не запускался', title: 'Загрузчик ещё не запускался', why: 'Heartbeat не записан ни разу. Запустите команду loader.' };
  else if (r.now - r.last_heartbeat_at > HEARTBEAT_SILENT_AFTER) loader = { kind: 'silent', tone: 'bad', word: 'Не отвечает', title: 'Загрузчик не отвечает', why: 'Heartbeat давно не обновлялся: процесс остановлен, упал или завис.' };
  else if (pauseActive) loader = { kind: 'paused', tone: 'warn', word: 'Пауза', title: 'Пауза Telegram', why: 'Telegram попросил подождать (FLOOD_WAIT). Загрузчик жив и ждёт.' };
  else if (r.last_error !== null && !errorPast && r.next_attempt_at > r.now) loader = { kind: 'retrying', tone: 'bad', word: 'Ошибка', title: 'Ошибка, ждёт повтора', why: 'Последний запрос не удался. Загрузчик повторит его сам.' };
  else loader = { kind: 'ok', tone: 'ok', word: 'Работает', title: 'Работает', why: 'Процесс жив, основной цикл крутится.' };
  let history;
  if (r.newest_fetched_id === null && r.pass_reached_id === null) history = { kind: 'not_started', main: 'Загрузка истории ещё не начиналась' };
  else if (r.newest_fetched_id === null) history = { kind: 'first_pass', main: `Первый проход дошёл до ID ${id(r.pass_reached_id)}`, sub: 'Сколько осталось до начала канала, заранее неизвестно.' };
  else if (r.pass_reached_id !== null) history = { kind: 'loaded_pass', main: `История загружена до ID ${id(r.newest_fetched_id)}`, sub: `Проход за новыми сообщениями дошёл до ID ${id(r.pass_reached_id)}.` };
  else history = { kind: 'loaded', main: `История загружена до ID ${id(r.newest_fetched_id)}`, sub: 'Незавершённого прохода нет.' };
  return { loader, history, pauseActive, errorPast };
}

// ---------------------------------------------------------------- форматирование
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const id = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function utc(ms) { const d = new Date(ms); return d.toISOString().slice(0, 19).replace('T', ' ') + ' UTC'; }
// Как на сервере: <time datetime="…Z">… UTC</time>; скрипт ниже переводит в пояс браузера.
const time = (ms) => ms === null ? '<span class="muted">—</span>' : `<time datetime="${new Date(ms).toISOString()}">${utc(ms)}</time>`;
function rel(ms, now) {
  const d = Math.round((ms - now) / 1000), a = Math.abs(d);
  const txt = a < 60 ? `${a} с` : a < 3600 ? `${Math.round(a / 60)} мин` : `${Math.floor(a / 3600)} ч ${Math.round((a % 3600) / 60)} мин`;
  return d >= 0 ? `через ${txt}` : `${txt} назад`;
}
function localizeTimes(root) {
  root.querySelectorAll('time[datetime]').forEach((el) => {
    el.textContent = new Date(el.dateTime).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  });
}

// ---------------------------------------------------------------- вариант A: карточка состояния и список
function VariantA(r) {
  const v = derive(r);
  let h = `<div class="a-wrap"><div class="a-top"><h1>Briefly Searcher · загрузчик</h1><span class="muted" style="font-size:13px">Сводка на ${time(r.now)}</span></div><div class="a-stack">`;
  h += `<div class="a-card a-state"><span class="a-dot" style="background:var(--${v.loader.tone})"></span><div>
    <div class="a-state-title">${esc(v.loader.title)}</div><div class="muted">${esc(v.loader.why)}</div></div></div>`;
  if (v.pauseActive) h += `<div class="a-banner"><b>Пауза Telegram до ${time(r.flood_wait_until)}</b><div class="muted" style="font-size:14px">До этого времени запросы к Telegram не отправляются.</div></div>`;
  if (r.last_error) h += v.errorPast
    ? `<div class="a-err past">Последняя ошибка была в ${time(r.last_error_at)}: <code>${esc(r.last_error)}</code>. После неё загрузчик работал успешно.</div>`
    : `<div class="a-err"><b>Ошибка в ${time(r.last_error_at)}</b><pre>${esc(r.last_error)}</pre>Следующая попытка: ${time(r.next_attempt_at)}</div>`;
  h += `<div class="a-card"><div class="a-h-main">${esc(v.history.main)}</div>${v.history.sub ? `<div class="muted">${esc(v.history.sub)}</div>` : ''}</div>`;
  h += `<div class="a-card"><dl class="a-dl">
    <dt>Сообщений в raw_posts</dt><dd>${id(r.raw_posts_count)}</dd>
    <dt>Heartbeat</dt><dd>${time(r.last_heartbeat_at)}</dd>
    <dt>Последний успешный запрос</dt><dd>${time(r.last_successful_request_at)}</dd>
    <dt>newest_fetched_id</dt><dd>${r.newest_fetched_id === null ? '<span class="muted">ещё нет</span>' : id(r.newest_fetched_id)}</dd>
  </dl></div></div></div>`;
  return h;
}

// ---------------------------------------------------------------- вариант B: плитки
function VariantB(r) {
  const v = derive(r);
  const tile = (label, big, sub, cls = '') => `<div class="b-tile ${cls}"><div class="b-label">${label}</div><div class="b-big">${big}</div><div class="muted">${sub}</div></div>`;
  let h = `<div class="b-strip ${v.loader.tone}"><span>Загрузчик: ${esc(v.loader.title)}</span><span>Сводка на ${time(r.now)}</span></div><div class="b-wrap"><div class="b-grid">`;
  h += tile('Загрузчик', `<span class="t-${v.loader.tone}">${esc(v.loader.word)}</span>`,
    r.last_heartbeat_at === null ? 'heartbeat ещё не было' : `heartbeat ${time(r.last_heartbeat_at)} · ${rel(r.last_heartbeat_at, r.now)}`);
  h += v.pauseActive
    ? tile('Telegram', 'Пауза', `до ${time(r.flood_wait_until)} · ${rel(r.flood_wait_until, r.now)}`, 'tone-warn')
    : tile('Telegram', 'Без паузы', r.last_successful_request_at === null ? 'запросов ещё не было' : `успешный запрос ${time(r.last_successful_request_at)} · ${rel(r.last_successful_request_at, r.now)}`);
  h += !r.last_error ? tile('Последняя ошибка', '<span class="muted">Нет</span>', 'ошибок не было')
    : v.errorPast ? tile('Последняя ошибка', '<span class="muted">Прошла</span>', `${time(r.last_error_at)}: <code>${esc(r.last_error)}</code><br>после неё загрузчик работал успешно`)
    : `<div class="b-tile tone-bad"><div class="b-label">Последняя ошибка</div><pre>${esc(r.last_error)}</pre><div class="muted">в ${time(r.last_error_at)}<br>повтор ${time(r.next_attempt_at)} · ${rel(r.next_attempt_at, r.now)}</div></div>`;
  const histBig = v.history.kind === 'not_started' ? '<span class="muted">—</span>'
    : v.history.kind === 'first_pass' ? `ID ${id(r.pass_reached_id)}` : `ID ${id(r.newest_fetched_id)}`;
  const histLabel = v.history.kind === 'first_pass' ? 'Первый проход дошёл до' : v.history.kind === 'not_started' ? 'История' : 'История загружена до';
  h += `<div class="b-tile wide"><div class="b-label">${histLabel}</div><div class="b-big">${histBig}</div><div class="muted">${esc(v.history.kind === 'first_pass' ? v.history.sub : v.history.sub || v.history.main)}</div></div>`;
  h += tile('Сообщений сохранено', id(r.raw_posts_count), 'строк в raw_posts');
  h += `</div></div>`;
  return h;
}

// ---------------------------------------------------------------- вариант C: хронология
function VariantC(r) {
  const v = derive(r);
  const ev = [];
  if (v.pauseActive) ev.push({ at: r.flood_wait_until, what: 'Закончится пауза Telegram', tone: 'warn' });
  if (r.last_error && !v.errorPast && r.next_attempt_at) ev.push({ at: r.next_attempt_at, what: 'Следующая попытка запроса', tone: 'bad' });
  if (r.last_heartbeat_at) ev.push({ at: r.last_heartbeat_at, what: 'Heartbeat загрузчика', tone: v.loader.kind === 'silent' ? 'bad' : 'ok',
    extra: v.loader.kind === 'silent' ? '<div class="t-bad">С тех пор загрузчик молчит.</div>' : '' });
  if (r.last_successful_request_at) ev.push({ at: r.last_successful_request_at, what: 'Последний успешный запрос к Telegram', tone: 'ok' });
  if (r.last_error) ev.push({ at: r.last_error_at, what: v.errorPast ? 'Ошибка (после неё были успешные запросы)' : 'Ошибка', tone: v.errorPast ? 'idle' : 'bad',
    extra: `<pre${v.errorPast ? ' class="muted" style="color:var(--muted)"' : ''}>${esc(r.last_error)}</pre>` });
  ev.sort((a, b) => b.at - a.at);
  const future = ev.filter((e) => e.at > r.now), past = ev.filter((e) => e.at <= r.now);
  const item = (e, f) => `<div class="c-item tone-${e.tone} ${f ? 'future' : ''}"><div class="c-when">${time(e.at)} · ${rel(e.at, r.now)}</div><div class="c-what">${esc(e.what)}</div>${e.extra || ''}</div>`;
  let h = `<div class="c-wrap"><aside class="c-side"><h1>Briefly Searcher · загрузчик</h1>
    <div class="c-status t-${v.loader.tone}">${esc(v.loader.title)}</div><div class="muted">${esc(v.loader.why)}</div>
    <div class="c-facts">
      <div class="c-fact"><div class="muted">${esc(v.history.kind === 'first_pass' ? 'Первый проход' : 'История')}</div><div class="n">${esc(v.history.main.replace(/^Первый проход /, ''))}</div>${v.history.sub ? `<div class="muted" style="font-size:13px">${esc(v.history.sub)}</div>` : ''}</div>
      <div class="c-fact"><div class="muted">Сообщений в raw_posts</div><div class="n">${id(r.raw_posts_count)}</div></div>
    </div></aside><main><div class="c-line">`;
  h += future.map((e) => item(e, true)).join('');
  h += `<div class="c-now"><span>Сейчас · ${time(r.now)}</span></div>`;
  h += past.length ? past.map((e) => item(e, false)).join('') : `<div class="c-item"><div class="c-what muted">Событий ещё не было</div></div>`;
  h += `</div></main></div>`;
  return h;
}

// ---------------------------------------------------------------- вариант D: терминал
function VariantD(r) {
  const v = derive(r);
  const c = { ok: 'd-ok', warn: 'd-warn', bad: 'd-bad', idle: 'd-dim' }[v.loader.tone];
  const k = (s) => `<span class="d-key">${s.padEnd(20)}</span>`;
  const dim = (s) => `<span class="d-dim">${s}</span>`;
  const t = (ms) => ms === null ? dim('—') : `${time(ms)} ${dim('(' + rel(ms, r.now) + ')')}`;
  let lines = [];
  lines.push(`<span class="${c}">●</span> briefly-searcher loader — <span class="${c}">${esc(v.loader.title.toLowerCase())}</span>`);
  lines.push(`  ${k('Heartbeat:')}${t(r.last_heartbeat_at)}`);
  lines.push(`  ${k('Telegram:')}${v.pauseActive ? `<span class="d-warn">пауза FLOOD_WAIT до</span> ${t(r.flood_wait_until)}` : 'без паузы'}`);
  lines.push(`  ${k('Успешный запрос:')}${t(r.last_successful_request_at)}`);
  if (r.last_error) {
    lines.push(`  ${k('Ошибка:')}${v.errorPast ? dim(esc(r.last_error) + ' — прошла') : `<span class="d-bad">${esc(r.last_error)}</span>`}`);
    lines.push(`  ${k('')}${dim('в')} ${t(r.last_error_at)}`);
    if (!v.errorPast) lines.push(`  ${k('Повтор:')}${t(r.next_attempt_at)}`);
  } else lines.push(`  ${k('Ошибка:')}${dim('нет')}`);
  lines.push('');
  lines.push(`  ${k('История:')}${esc(v.history.main)}`);
  if (v.history.sub) lines.push(`  ${k('')}${dim(esc(v.history.sub))}`);
  lines.push(`  ${k('raw_posts:')}${id(r.raw_posts_count)} сообщений`);
  lines.push(`  ${k('newest_fetched_id:')}${r.newest_fetched_id === null ? dim('NULL') : id(r.newest_fetched_id)}`);
  return `<div class="d-page"><div class="d-box"><div class="d-prompt">$ briefly-searcher status · сводка на ${time(r.now)}</div><pre>${lines.join('\n')}</pre></div></div>`;
}

// ---------------------------------------------------------------- вариант E: шкала ID
function VariantE(r) {
  const v = derive(r);
  const top = r.max_id || 1;
  // В очередном проходе новых ID мало по сравнению со всей историей, поэтому шкала показывает только хвост:
  // слева — сжатая «вся история до newest_fetched_id», справа — новые ID.
  const lo = v.history.kind === 'loaded_pass' ? r.newest_fetched_id - (top - r.newest_fetched_id) : 0;
  const pct = (x) => `${Math.max(0, Math.min(100, ((x - lo) / (top - lo)) * 100)).toFixed(2)}%`;
  const mark = (x, text, below) => {
    const p = parseFloat(pct(x));
    return `<div class="e-mark ${below ? 'below' : ''} ${p < 15 ? 'start' : p > 85 ? 'end' : ''}" style="left:${p}%">${text}</div>`;
  };
  let bar = '';
  if (v.history.kind === 'first_pass') {
    bar += `<div class="e-seg unknown" style="left:0;width:${pct(r.pass_reached_id)}"></div>`;
    bar += `<div class="e-seg saved" style="left:${pct(r.pass_reached_id)};right:0;border-radius:0 8px 8px 0"></div>`;
    bar += mark(r.pass_reached_id, `проход здесь · ID ${id(r.pass_reached_id)}`);
    bar += mark(lo, 'начало канала: ?', true) + mark(top, `ID ${id(top)}`, true);
  } else if (v.history.kind === 'loaded') {
    bar += `<div class="e-seg saved" style="left:0;right:0;border-radius:8px"></div>` + mark(lo, 'начало канала', true) + mark(top, `ID ${id(top)}`, true);
  } else if (v.history.kind === 'loaded_pass') {
    bar += `<div class="e-seg saved" style="left:0;width:${pct(r.newest_fetched_id)};border-radius:8px 0 0 8px"></div>`;
    bar += `<div class="e-seg gap" style="left:${pct(r.newest_fetched_id)};width:calc(${pct(r.pass_reached_id)} - ${pct(r.newest_fetched_id)})"></div>`;
    bar += `<div class="e-seg pass" style="left:${pct(r.pass_reached_id)};right:0;border-radius:0 8px 8px 0"></div>`;
    bar += mark(lo, '← вся история', true) + mark(r.newest_fetched_id, `newest_fetched_id ${id(r.newest_fetched_id)}`);
    bar += mark(r.pass_reached_id, `проход · ${id(r.pass_reached_id)}`, true) + mark(top, `ID ${id(top)}`);
  } else {
    bar += `<div class="e-mark below" style="left:50%">ничего не сохранено</div>`;
  }
  let h = `<div class="e-wrap"><div class="e-head"><div style="font-weight:650">Briefly Searcher · загрузчик</div>
    <div><span class="e-pill ${v.loader.tone}">● ${esc(v.loader.title)}</span> <span class="muted" style="font-size:13px">сводка на ${time(r.now)}</span></div></div>`;
  h += `<div class="e-hero"><div class="e-hero-title">${esc(v.history.main)}</div><div class="muted">${esc(v.history.sub || '')}</div>
    <div class="e-bar">${bar}</div>
    <div class="e-legend"><span><i class="e-sw" style="background:var(--ok)"></i>сохранено</span><span><i class="e-sw" style="background:var(--accent)"></i>текущий проход</span>
    <span><i class="e-sw" style="background:repeating-linear-gradient(45deg,transparent 0 3px,var(--muted) 3px 5px)"></i>ещё не загружено</span>
    <span>Шкала — по ID сообщений, не по их числу: в ID есть пропуски.</span></div></div>`;
  if (v.pauseActive) h += `<div class="e-alert warn"><b>Пауза Telegram до ${time(r.flood_wait_until)}</b> · ${rel(r.flood_wait_until, r.now)}</div>`;
  if (r.last_error) h += v.errorPast
    ? `<div class="e-alert past">Последняя ошибка была в ${time(r.last_error_at)}: <code>${esc(r.last_error)}</code>. После неё загрузчик работал успешно.</div>`
    : `<div class="e-alert bad"><b>Ошибка в ${time(r.last_error_at)}</b>, повтор ${time(r.next_attempt_at)}<pre>${esc(r.last_error)}</pre></div>`;
  h += `<div class="e-row">
    <div class="e-kv"><div class="k">Сообщений в raw_posts</div><div class="v">${id(r.raw_posts_count)}</div></div>
    <div class="e-kv"><div class="k">Heartbeat</div><div class="v">${time(r.last_heartbeat_at)}</div></div>
    <div class="e-kv"><div class="k">Успешный запрос</div><div class="v">${time(r.last_successful_request_at)}</div></div>
    <div class="e-kv"><div class="k">newest_fetched_id</div><div class="v">${r.newest_fetched_id === null ? '<span class="muted">ещё нет</span>' : id(r.newest_fetched_id)}</div></div></div></div>`;
  return h;
}

// ---------------------------------------------------------------- переключатель
const VARIANTS = [
  ['A', 'Карточка и список', VariantA],
  ['B', 'Плитки', VariantB],
  ['C', 'Хронология', VariantC],
  ['D', 'Терминал', VariantD],
  ['E', 'Шкала ID', VariantE],
];
const params = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(([k]) => k === (params.get('variant') || 'A').toUpperCase()));
let stateKey = STATES[params.get('state')] ? params.get('state') : 'first_pass';
let summary = makeSummary(stateKey, Date.now());

function syncUrl() {
  const p = new URLSearchParams(location.search);
  p.set('variant', VARIANTS[vi][0]); p.set('state', stateKey);
  try { history.replaceState(null, '', '?' + p.toString()); } catch (e) { /* file:// в некоторых браузерах */ }
}
function render() {
  const app = document.getElementById('app');
  app.innerHTML = VARIANTS[vi][2](summary);
  localizeTimes(app);
  document.getElementById('vlabel').textContent = `${VARIANTS[vi][0]} · ${VARIANTS[vi][1]}`;
}
function go(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; syncUrl(); render(); }

const sel = document.getElementById('state');
sel.innerHTML = Object.entries(STATES).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join('');
sel.value = stateKey;
sel.addEventListener('change', () => { stateKey = sel.value; summary = makeSummary(stateKey, Date.now()); syncUrl(); render(); });
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
setInterval(() => { summary = tick(summary, stateKey); render(); }, 5000);
syncUrl(); render();
</script>
</body>
</html>
